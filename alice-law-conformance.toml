# ALICE-Law conformance manifest for this crate (alice-analytics). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / mutant / since / note / reference_repo) is the "Manifest" section
# of docs/CONFORMANCE.md in that repository.
#
# Every entry is written from what this repository's tree at the commit below
# shows, checked directly. `pass` is claimed only where the named mutant was
# carried out and turned the evidence red. `fail-known` says where the
# requirement is unmet. `unverified` means no violation is known but the
# machine check the gate asks for is missing or incomplete; the note says what
# is missing. Mutants were run on aarch64 (macOS), debug and release, and
# reverted.
#
# Checked at: 4f74013 (origin/main, 2026-10-15).

[G1]
status = "unverified"
evidence = ["clippy.toml", ".github/workflows/ci.yml"]
mutant = "x.sin() added to a library function in src/stats.rs: cargo clippy --all-targets -- -W clippy::pedantic -D warnings fails (use of a disallowed method `f64::sin`); the same in the feature-gated src/law.rs with --all-features and in the std-gated src/export.rs fail the same way; x.sin_cos() fails (`f64::sin_cos`); an f32 x.cbrt() fails (`f32::cbrt`); libm::sin(x) in src/stats.rs passes every lane (rc 0, default and --no-default-features); all reverted"
note = "no banned call is known: a search of src, tests, examples and fuzz targets for the banned method names finds none outside alice-det-math, and the only libm:: calls are the correctly rounded fma / sqrt / ceil / floor / round of the no_std shim (src/math.rs:56-72). The method list is complete: clippy.toml:18-69 bans all 25 methods the G1 list marks banned, for f32 and f64 (sin_cos at lines 20 and 46), plus powi (lines 43 and 69, the pending default, banned with the reason in the comment above the list). Every feature set is linted: .github/workflows/ci.yml:107, :109 and :113 run cargo clippy --all-targets with default, all and no default features, and :81 lints the no_std + law library on thumbv7em-none-eabihf (features: std, law and simd, a no-op). Missing, so not pass: (1) no committed canary test injects a banned call and confirms the lint still fires (the mutants above were run by hand); (2) the libm crate is a direct dependency (Cargo.toml:36) and its free functions (libm::sin, libm::pow, ...) are not methods, so disallowed-methods does not see them, as the last mutant shows. The fuzz crate (fuzz/Cargo.toml, its own workspace) is not linted; it is not library code."
reference_repo = "ALICE-SDF"

[G2]
status = "fail-known"
note = "no Law helper for max / min, no clippy ban on f64::max / f64::min and no default-deny manifest of raw_* exceptions. The library calls the platform operations directly: f64::max at src/anomaly.rs:799, src/law.rs:309, src/math.rs:98, src/privacy.rs:559; f64::clamp at src/privacy.rs:356,412-414, src/sketch.rs:527, src/stats.rs:96,181, src/streaming_ops.rs:450 (the integer max / min elsewhere in src are not float). Hand-written running min / max with strict comparisons keep the first of two equal-comparing zeros, so a stream holding both -0.0 and +0.0 gives an order-dependent result: StreamingStats at src/stats.rs:270 and :273 ([-0.0, +0.0] gives max -0.0, [+0.0, -0.0] gives min +0.0), SlidingWindow::min / max at src/window.rs:221 and :236, and the DDSketch min / max at src/sketch.rs:447, :450 and on merge at :657, :660. tests/float_edge_golden.rs:16-20 records the StreamingStats / SlidingWindow case as deliberately not pinned. This crate is scalar f64 only (the simd feature is a no-op, Cargo.toml [features])."
reference_repo = "ALICE-SDF"

