[G4]
status = "fail-known"
evidence = ["tests/float_edge_golden.rs", "tests/determinism_golden.rs", ".github/workflows/ci.yml", ".github/workflows/release-profile.yml"]
note = "unmet in one place: the crate has identified a signed-zero case it does not pin, the running min / max of a stream holding both zeros (tests/float_edge_golden.rs:16-20: StreamingStats and SlidingWindow, the order-dependent result described under G2), so not every identified case is checked against a fixed bit pattern; pinning it would freeze the G2 defect, so this waits on that fix. Everything else is in place and has teeth: tests/float_edge_golden.rs (21 tests, to_bits() equality for signed zero, cancellation of near-equal large values, opposite-sign sums, collinear points far from the origin, zero variance; each case calls the library) and tests/determinism_golden.rs run debug in .github/workflows/ci.yml:42 (cargo test --all-features) on macos-latest and ubuntu-24.04-arm (aarch64) and ubuntu-latest and windows-latest (x86_64), ci.yml:34, and release in .github/workflows/release-profile.yml:49 on ubuntu-latest (x86_64) and macos-latest (aarch64), :42; no test job has continue-on-error. Measured: changing the expected bits of streaming_stats_variance_of_near_equal_large_values (0x3fe5_5555_5555_5555 to ..54) fails it in debug and in --release; rewriting the intercept at src/streaming_ops.rs:345 to the outer-negated fma -(slope.mul_add(mean_x, -mean_y)) fails linear_regression_flat_negative_zero_line_is_positive_zero in debug and in --release (aarch64); both reverted. The main branch has no branch protection (the GitHub API reports it not protected), so the legs are blocking jobs, not required status checks."
reference_repo = "ALICE-Physics"

