# ALICE-Law G11: this repository's own rows of conformance/g11.toml (the rows of the checkers the ALICE
# crates share are generated from ALICE-Law). scripts/g11_table.sh --write writes the table from both.
#
# The golden suites are run by scripts/run_tests.sh, which fails a step when a named test binary ran no
# test; its zero test is therefore the compared-nothing test of each leg, and each canary is a test of a
# binary the leg names.

[[row]]
gate = "G4"
checker = ".github/workflows/ci.yml#- name: Test (unit + integration + doc, every feature)>scripts/run_tests.sh"
canary = "tests/determinism_golden.rs::checker_rejects_a_wrong_hash"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G5"
checker = ".github/workflows/release-profile.yml#- name: Test (release, every feature, determinism_golden + float_edge_golden)>scripts/run_tests.sh"
canary = "tests/determinism_golden.rs::checker_rejects_a_wrong_hash"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G6"
checker = ".github/workflows/ci.yml#- name: Test (unit + integration + doc, every feature)>scripts/run_tests.sh"
canary = "tests/analytics_semantics_id.rs::every_pin_moves_the_identifier"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]
