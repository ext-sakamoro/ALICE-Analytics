[package]
name = "alice-analytics"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "High-performance telemetry & probabilistic statistical estimation — HyperLogLog++, DDSketch, Count-Min Sketch, local differential privacy, streaming anomaly detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Analytics"
keywords = ["telemetry", "hyperloglog", "sketch", "cardinality", "no_std"]
categories = ["algorithms", "science", "no-std"]

[features]
default = ["std"]
std = []
simd = []  # no-op since 2026-09-14: the only user (HyperLogLog AVX2 zero-count) was dead code and lacked runtime feature detection; kept for semver

[lib]
path = "src/lib.rs"

[dependencies]
# no_std build の float 超越関数 (src/math.rs、std build では未使用)
libm = "0.2"
