[package]
name = "alice-analytics"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "High-performance telemetry & probabilistic statistical estimation — HyperLogLog++, DDSketch, Count-Min Sketch, local differential privacy, streaming anomaly detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Analytics"
keywords = ["telemetry", "hyperloglog", "sketch", "cardinality", "no_std"]
categories = ["algorithms", "science", "no-std"]

[features]
default = ["std"]
std = ["alice-det-math/std"]
# law::ResidualSketch / law::residual_summary — residual distribution of an
# alice-zip SignalLaw (pulls in alice-zip without its std feature, plus alloc)
law = ["dep:alice-zip"]
simd = []  # no-op since 2026-09-14: the only user (HyperLogLog AVX2 zero-count) was dead code and lacked runtime feature detection; kept for semver

[lib]
path = "src/lib.rs"

[dependencies]
# Cross-platform bit-exact transcendentals (ln / exp / powf): the platform
# `libm` differs in the last ulp between macOS / glibc / MSVC / wasm, so every
# transcendental goes through this crate on std and no_std alike. Enforced by
# clippy.toml `disallowed-methods`, pinned by tests/determinism_golden.rs.
#
# 0.4 以降は算術の識別子 `SEMANTICS_ID` を持つ (crate root から再 export、
# `law::ResidualSummary::law_id` が法則の識別子と混ぜる) 0.3 には無いので、
# 0.3 を解決する消費者と同じ graph に入ると「どの算術で出た数か」を言えない
# version (`alice-zip` 0.8 / `alice-db` / `alice-physics` と同じ 0.4 系統に揃える)
alice-det-math = { version = "0.4", default-features = false }
# no_std build の float 丸め / sqrt (src/math.rs、std build では未使用)
libm = "0.2"
alice-zip = { version = "0.8", default-features = false, optional = true }

# The float lints that suggest re-fusing arithmetic are off as a property of
# the crate, not case by case: every transcendental goes through
# `alice-det-math` (see clippy.toml), and these two lints propose rewriting
# those calls back into `mul_add` / platform `libm` forms. `alice-det-math`
# itself declares them the same way. Not enabled by the `pedantic` set the CI
# passes today, so this is a guard for the day `nursery` is switched on.
[lints.clippy]
suboptimal_flops = "allow"
imprecise_flops = "allow"

[dev-dependencies]
# determinism golden hashes (tests/determinism_golden.rs)
sha2 = "0.10"

[[example]]
name = "residual_summary"
required-features = ["law"]
