[package]
name = "alice-analytics-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.alice-analytics]
path = ".."

# cargo-machete false-positive 予防 (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
# libfuzzer-sys は fuzz_target! macro 内でのみ参照されるため machete が誤検知
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

# 攻撃者制御 MetricEvent 列で MetricPipeline が panic せず終端する
[[bin]]
name = "fuzz_event_parse"
path = "fuzz_targets/fuzz_event_parse.rs"
doc = false

# 攻撃者制御 f64 列で streaming stats + anomaly detector が panic せず終端する
[[bin]]
name = "fuzz_metric_aggregate"
path = "fuzz_targets/fuzz_metric_aggregate.rs"
doc = false

# 攻撃者制御 bytes 列で HyperLogLog + DDSketch insert / merge が panic せず終端する
[[bin]]
name = "fuzz_sketch_insert"
path = "fuzz_targets/fuzz_sketch_insert.rs"
doc = false

[workspace]
members = ["."]
