name: CI

# scripts/preflight.sh runs the same commands with the same arguments locally;
# a step added here is added there in the same commit.

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # - macos-latest      → aarch64-apple-darwin
        # - ubuntu-24.04-arm  → aarch64-unknown-linux-gnu
        # - ubuntu-latest     → x86_64-unknown-linux-gnu
        # - windows-latest    → x86_64-pc-windows-msvc
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # scripts/run_tests.sh fails the step when no test ran or when a named
      # golden file ran none (a feature or target mismatch would otherwise pass
      # as an empty run); the full suite still runs
      - name: Test (unit + integration + doc, every feature)
        shell: bash
        run: scripts/run_tests.sh determinism_golden,float_edge_golden,float_environment=2 -- cargo test --all-features

      - name: Test (unit + integration + doc, default features)
        shell: bash
        run: scripts/run_tests.sh determinism_golden,float_edge_golden,float_environment=2 -- cargo test

      # The library is no_std, so its unit tests must also compile and run
      # without the `std` feature: that is the only lane that executes the
      # `libm` rounding path (`sqrt` / `ceil` / `floor` / `round` / `mul_add`)
      # on a host. `--lib` only, so this stays a few seconds per OS.
      - name: Test (lib unit tests, no_std)
        run: cargo test --lib --no-default-features
      - name: Test (lib unit tests, no_std + law)
        run: cargo test --lib --no-default-features --features law

      - name: Example (residual_summary, law feature)
        run: cargo run --example residual_summary --features law

  no-std:
    name: Build (no_std, host + thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # installs the target for the toolchain pinned in rust-toolchain.toml
      - name: Add thumbv7em-none-eabihf
        run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Check (lib, no_std, host)
        run: cargo check --lib --no-default-features
      - name: Check (lib, no_std + law, host)
        run: cargo check --lib --no-default-features --features law
      # a bare-metal target has no std at all, so this is the build that proves
      # the library compiles without it
      - name: Build (lib, no_std, thumbv7em-none-eabihf)
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
      - name: Build (lib, no_std + law, thumbv7em-none-eabihf)
        run: cargo build --lib --no-default-features --features law --target thumbv7em-none-eabihf
      - name: Clippy (lib, no_std + law, thumbv7em-none-eabihf)
        run: cargo clippy --lib --no-default-features --features law --target thumbv7em-none-eabihf -- -W clippy::pedantic -D warnings

  feature-powerset:
    name: Feature powerset (cargo-hack, depth 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: cargo hack check (lib, feature powerset, depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2

  clippy:
    name: Clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-targets --all-features -- -W clippy::pedantic -D warnings
      # the no_std build of every target: lints that appear only there (an item
      # used only under std) and tests that need std declare it
      - name: Clippy (no default features, all targets)
        run: cargo clippy --all-targets --no-default-features -- -W clippy::pedantic -D warnings
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # G7 / G8: the boundary of the public API, enumerated from rustdoc JSON
      # (pinned toolchain, RUSTC_BOOTSTRAP=1), against scripts/api_boundary.toml
      - name: API boundary (tests)
        run: python3 scripts/test_api_boundary.py
      - name: API boundary (rustdoc JSON, every item decided)
        run: python3 scripts/api_boundary.py
      # the direct libm dependency: its free functions are out of reach of the
      # f32 / f64 method entries, so clippy.toml bans them by path; this fails
      # when that list and the libm in Cargo.lock disagree, and plants banned
      # libm calls in a throwaway crate to confirm clippy flags them
      - name: libm ban list (tests)
        run: python3 scripts/test_libm_ban_check.py
      - name: libm ban list (complete for the resolved libm, and enforced)
        run: python3 scripts/libm_ban_check.py

  # The declared `rust-version` compiled with exactly that toolchain. Bump
  # `rust-version` in Cargo.toml and the version below in the same commit.
  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.87 check --lib
      - name: cargo check on MSRV (lib, all features)
        run: cargo +1.87 check --lib --all-features

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, all features)
        run: cargo doc --lib --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      # Apache-2.0 §4: the published package carries LICENSE-APACHE and NOTICE
      - name: Licence files are packaged
        run: |
          list=$(cargo package --list --allow-dirty)
          for f in LICENSE-APACHE NOTICE; do
            printf '%s\n' "$list" | grep -qx "$f" || { echo "::error::the package lacks $f"; exit 1; }
          done
          echo "LICENSE-APACHE and NOTICE packaged"

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      - name: Deprecation pin (tests)
        run: python scripts/test_deprecation_pin.py
      - name: Deprecation pin (privacy module)
        run: python scripts/deprecation_pin.py
      # the zero-test guard shared with ALICE-DB, on each OS's own bash
      - name: run_tests.sh (tests)
        run: python scripts/test_run_tests.py
      # G14, static half: no fast-math-style flag, target-cpu=native or flag value
      # the guard cannot resolve in any file a flag can come from (deliberate
      # occurrences in scripts/build_config_allowlist.toml); nothing read fails
      - name: Build configuration guard (test, then check)
        run: |
          python scripts/test_build_config_guard.py
          python scripts/build_config_guard.py
      # the dynamic half's parser on each OS (the check itself runs in release-profile.yml)
      - name: Effective rustc flags check (tests)
        run: python scripts/test_build_flags_check.py
      - name: Entropy guard (tests)
        run: python scripts/test_entropy_guard.py
      - name: Entropy guard (no OS entropy / wall clock in production code)
        run: python scripts/entropy_guard.py
      # G7 / G8: no reader of external bytes and no type-erasing entry point (both n/a while this holds)
      - name: Reader guard (tests)
        run: python scripts/test_reader_guard.py
      - name: Reader guard
        run: python scripts/reader_guard.py
      # G13: no HashMap / HashSet, parallel combination or address order in production code
      - name: Order guard (tests)
        run: python scripts/test_order_guard.py
      - name: Order guard
        run: python scripts/order_guard.py
      # Apache-2.0 everywhere it is stated (manifest, files, READMEs, NOTICE);
      # 0 comparisons fail
      - name: Licence agrees (tests)
        run: python scripts/test_license_check.py
      - name: Licence agrees
        run: python scripts/license_check.py
      # no built library or executable is tracked (by name or header); waivers only in
      # .github/tracked-binaries.txt with a reason; an unreadable file or 0 files read fails
      - name: Tracked binaries (tests)
        run: python scripts/test_tracked_binaries.py
      - name: Tracked binaries
        run: python scripts/tracked_binaries.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  actionlint:
    name: actionlint (workflow YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py
      # every branch-push workflow has a concurrency group that cancels a superseded
      # branch run but never a run on main; the checker's own tests run first
      - name: workflow-concurrency
        run: |
          python3 scripts/test_workflow_concurrency.py
          python3 scripts/workflow_concurrency.py
