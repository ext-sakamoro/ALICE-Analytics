name: ALICE Analytics CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # 2026-09-15 追加 (canonical 罠 #29 遡及): crates.io no-std category を掲げつつ
  # --no-default-features は 38 error で一度も通っていなかった (f64 mul_add / sqrt / ln 等 + std::f64::consts)
  # src/math.rs FloatExt (libm) で修正、bare-metal thumbv7em (rust-toolchain.toml の targets) で証明
  no_std:
    name: no_std (host + bare-metal thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - name: Check (no_std, host)
        run: cargo check --lib --no-default-features
      - name: Check (no_std + simd, host)
        run: cargo check --lib --no-default-features --features simd
      - name: Check (no_std, bare-metal thumbv7em-none-eabihf)
        run: cargo check --lib --no-default-features --target thumbv7em-none-eabihf
      - name: Clippy (no_std, bare-metal)
        run: cargo clippy --lib --no-default-features --target thumbv7em-none-eabihf -- -D warnings

  feature-powerset:
    name: Feature powerset (cargo-hack, depth 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --lib --feature-powerset --depth 2

  doc:
    name: Doc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
