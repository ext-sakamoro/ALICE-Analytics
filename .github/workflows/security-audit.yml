name: Security & Hygiene

# - RustSec advisories (weekly and on dependency changes)
# - dependency licenses / sources (cargo-deny)
# - unused dependencies (cargo-machete)
# - stubs left in production code (todo! / unimplemented! / panic!(STUB) / dbg!)
# - the packaged .crate builds on its own
# - coverage (informational)
#
# The public API check against the latest crates.io release is semver-checks.yml,
# which gates.
#
# scripts/preflight.sh runs the same commands with the same arguments
# (except the informational jobs and the packaged build).

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/security-audit.txt)
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'examples/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
      - '.github/alice-siblings'
      - '.github/actions/alice-siblings/**'
      - 'scripts/package_integrity.py'
      - 'scripts/test_package_integrity.py'
      - 'scripts/alice_siblings_check.py'
      - 'scripts/changed_paths.py'
      - '.github/paths/security-audit.txt'
  schedule:
    # every Monday 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock is not committed (library): cargo audit resolves one first.
      # The database is kept under target/ so it never collides with the
      # cargo-deny database in ~/.cargo/advisory-db.
      - name: Run cargo audit
        run: cargo audit --db "$RUNNER_TEMP/advisory-db" --deny yanked

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-deny (licenses + advisories + bans + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Run cargo machete
        run: cargo machete

  stub-guard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Stub / dbg guard (grep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - name: Detect todo! / unimplemented! / panic!(STUB) / dbg! in src/**
        run: scripts/stub_guard.sh

  package-integrity:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Package integrity (the published .crate builds on its own)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: dtolnay/rust-toolchain@stable
      # A file the package needs but does not contain (include_str! across the
      # package boundary, an over-broad exclude) builds fine in the repository
      # and fails only for users of the published crate. scripts/package_integrity.py
      # packages, unpacks and builds the .crate on its own (shipped lock, then a fresh
      # resolution); a path dependency whose required version only an unpublished
      # sibling in .github/alice-siblings satisfies (checked against the crates.io
      # index) is patched in and reported as `blocked`, every other error fails
      - name: Package integrity (tests)
        run: python3 scripts/test_package_integrity.py
      - name: Package integrity (package, unpack, build on its own)
        run: python3 scripts/package_integrity.py --expect-in-lock alice-det-math

  coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --all-features --summary-only 2>&1 | tee coverage-summary.txt
      - name: Upload coverage summary
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  # one result for the workflow: run=true needs every job above to succeed, run=false
  # needs them skipped (a skipped, cancelled or failed job after run=true is red)
  # coverage is informational: a job-level continue-on-error failure reaches needs as
  # `success`, so its failure stays non-blocking, but a skip or a cancel after run=true is
  # red like any other job
  gate:
    name: Gate
    if: always()
    needs: [changes, audit, deny, unused-deps, stub-guard, package-integrity, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
