name: Security & Hygiene

# - RustSec advisories (weekly and on dependency changes)
# - dependency licenses / sources (cargo-deny)
# - unused dependencies (cargo-machete)
# - stubs left in production code (todo! / unimplemented! / panic!(STUB) / dbg!)
# - the packaged .crate builds on its own
# - coverage and semver checks (informational)
#
# scripts/preflight.sh runs the same commands with the same arguments
# (except the informational jobs and the packaged build).

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'examples/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'examples/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
  schedule:
    # every Monday 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock is not committed (library): cargo audit resolves one first.
      # The database is kept under target/ so it never collides with the
      # cargo-deny database in ~/.cargo/advisory-db.
      - name: Run cargo audit
        run: cargo audit --db "$RUNNER_TEMP/advisory-db" --deny yanked

  deny:
    name: cargo-deny (licenses + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Run cargo machete
        run: cargo machete

  stub-guard:
    name: Stub / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect todo! / unimplemented! / panic!(STUB) / dbg! in src/**
        run: scripts/stub_guard.sh

  package-integrity:
    name: Package integrity (the published .crate builds on its own)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # A file the package needs but does not contain (include_str! across the
      # package boundary, an over-broad exclude) builds fine in the repository
      # and fails only for users of the published crate.
      - name: cargo package
        run: cargo package --no-verify --allow-dirty
      - name: Unpack and build in isolation
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::no .crate was produced"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # build as a standalone package, not as a member of this repository
          printf '\n[workspace]\n' >> Cargo.toml
          cargo check --all-features

  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --all-features --summary-only 2>&1 | tee coverage-summary.txt
      - name: Upload coverage summary
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # pinned: newer releases raise their own required rustc version
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0
      # The baseline is the released version on crates.io, which is what
      # consumers actually resolve. A revision baseline (`--baseline-rev
      # HEAD~1`) points at whatever happened to precede this commit, which is
      # only a release boundary by accident.
      #
      # This step checks that the version bump declared in Cargo.toml is large
      # enough for the API changes made. It cannot be the whole gate: the lints
      # are selected by what the declared bump still requires, so once the bump
      # is the largest one possible every lint is skipped and the command exits
      # 0 after comparing nothing ("0 checks: 0 pass, N skip" /
      # "no semver update required").
      - name: Declared version bump covers the API changes
        run: |
          cargo semver-checks check-release --package alice-analytics
      # Second pass with the lints forced on, so that something is always
      # compared. Breaking changes are expected here whenever the release is a
      # breaking one, so the pass/fail of the lints is not the gate -- the gate
      # is that the number of checks actually run is not zero. A release that
      # breaks the API on purpose is covered by the step above, and the list
      # printed here is what belongs in CHANGELOG.
      - name: Enumerate API changes (fails only if nothing was compared)
        run: |
          set -o pipefail
          cargo semver-checks check-release \
            --package alice-analytics \
            --release-type patch 2>&1 | tee semver.log || true
          checks=$(grep -oE '[0-9]+ checks:' semver.log | grep -oE '[0-9]+' | tail -1)
          echo "checks run: ${checks:-<none>}"
          if [ -z "$checks" ] || [ "$checks" -eq 0 ]; then
            echo "::error::cargo-semver-checks compared 0 items, so it proves nothing about the API"
            exit 1
          fi
