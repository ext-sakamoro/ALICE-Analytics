name: Security & Hygiene

# - RustSec advisories (weekly and on dependency changes)
# - dependency licenses / sources (cargo-deny)
# - unused dependencies (cargo-machete)
# - stubs left in production code (todo! / unimplemented! / panic!(STUB) / dbg!)
# - the packaged .crate builds on its own
# - coverage and semver checks (informational)
#
# scripts/preflight.sh runs the same commands with the same arguments
# (except the informational jobs and the packaged build).

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'examples/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'examples/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
  schedule:
    # every Monday 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock is not committed (library): cargo audit resolves one first.
      # The database is kept under target/ so it never collides with the
      # cargo-deny database in ~/.cargo/advisory-db.
      - name: Run cargo audit
        run: cargo audit --db target/advisory-db --deny yanked

  deny:
    name: cargo-deny (licenses + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Run cargo machete
        run: cargo machete

  stub-guard:
    name: Stub / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect todo! / unimplemented! / panic!(STUB) / dbg! in src/**
        run: scripts/stub_guard.sh

  package-integrity:
    name: Package integrity (the published .crate builds on its own)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # A file the package needs but does not contain (include_str! across the
      # package boundary, an over-broad exclude) builds fine in the repository
      # and fails only for users of the published crate.
      - name: cargo package
        run: cargo package --no-verify --allow-dirty
      - name: Unpack and build in isolation
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::no .crate was produced"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # build as a standalone package, not as a member of this repository
          printf '\n[workspace]\n' >> Cargo.toml
          cargo check --all-features

  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --all-features --summary-only 2>&1 | tee coverage-summary.txt
      - name: Upload coverage summary
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compatibility, informational)
    runs-on: ubuntu-latest
    # informational: a planned API change is not blocked here
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the baseline revision needs the history
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # pinned: newer releases raise their own required rustc version
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0
      - name: Run cargo semver-checks (against HEAD~1)
        run: |
          cargo semver-checks check-release \
            --package alice-analytics \
            --baseline-rev "HEAD~1" \
            || true
