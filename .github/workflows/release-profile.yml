name: Release profile

# The golden tests under the release profile (`opt-level = 3`, no debug
# assertions): the optimiser may not re-associate, contract or reorder IEEE
# arithmetic, so the bits pinned in tests/determinism_golden.rs and
# tests/float_edge_golden.rs must be identical to the debug build. The test job
# in ci.yml runs the debug profile only. scripts/run_tests.sh fails the step
# when no test ran or when either named file ran none (a feature or target
# mismatch would otherwise pass as an empty run). Mirrored in scripts/preflight.sh.

# no paths filter: every push to main runs it, so a run skipped on a branch is
# never the last evidence before main (the job takes a few minutes on 2 legs)
on:
  push:
    # ci/**: the same check on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer push cancels an older run only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-golden:
    name: Golden tests, release profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # - macos-latest  → aarch64-apple-darwin
        # - ubuntu-latest → x86_64-unknown-linux-gnu
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (release, determinism_golden + float_edge_golden)
        run: scripts/run_tests.sh determinism_golden,float_edge_golden -- cargo test --release --test determinism_golden --test float_edge_golden
