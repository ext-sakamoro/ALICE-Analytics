# Rust toolchain pin: clippy lints change between releases, so CI and local
# builds use the same version
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# no_std 検証用 bare-metal target (CI no_std job + local、pinned toolchain 側に install)
targets = ["thumbv7em-none-eabihf"]
profile = "minimal"
