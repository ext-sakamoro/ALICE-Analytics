# scripts/reader_guard.py, structural half (ALICE-Law G7 / G8): the fns of
# src/ whose parameters take bytes, text or a reader, and why none of them
# reads Law-bearing bytes produced elsewhere. Keys are `<file>::<fn>`, `#2`
# for a second fn of the same name in the file.
[allow]
"src/export.rs::snapshot_to_prometheus" = "prefix is a metric-name prefix the caller chooses; the fn writes text, it reads none"
"src/export.rs::snapshots_to_prometheus" = "prefix is a metric-name prefix the caller chooses; the fn writes text, it reads none"
"src/pipeline.rs::new" = "name is the metric's label; the slot stores its bytes as a name, never parses a value from it"
"src/pipeline.rs::register" = "name is the metric's label used as a lookup key, not parsed into a value"
"src/pipeline.rs::lookup" = "name is the metric's label used as a lookup key, not parsed into a value"
"src/privacy.rs::permanent_response" = "private step of RAPPOR over the bloom bits this crate built from the value, not external bytes"
"src/privacy.rs::instantaneous_response" = "private step of RAPPOR over the permanent bits this crate computed, not external bytes"
"src/sketch.rs::hash_bytes" = "FNV-1a over caller bytes as an item identity for the sketches: bytes are hashed, never decoded into a value"
"src/sketch.rs::write" = "Hasher::write of FnvHasher: feeds bytes to the FNV hash, never decodes them"
"src/sketch.rs::insert_bytes" = "HyperLogLog insertion of an item given as bytes: hashed for its identity, never decoded"
"src/sketch.rs::insert_bytes#2" = "Count-Min insertion of an item given as bytes: hashed for its identity, never decoded"
"src/sketch.rs::estimate_bytes" = "Count-Min lookup of an item given as bytes: hashed for its identity, never decoded"
