# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version, the previous-identifier list that must keep the released value, and the
# release tags the base is read from (its values come from the published crate)
package = "alice-analytics"
manifest = "Cargo.toml"
tags = ["v{version}"]

[exempt]
SEMANTICS_ID = "alice-det-math's identifier, re-exported for reference: it is folded into ANALYTICS_SEMANTICS_ID (src/semantics.rs), so a move of it moves that identifier and is checked there; the crate writes no durable format (G8 n/a)"

[[id]]
path = "alice_analytics::semantics::ANALYTICS_SEMANTICS_ID"
previous = "alice_analytics::semantics::PREVIOUS_ANALYTICS_SEMANTICS_IDS"
previous-tests = [
    "tests/analytics_semantics_id.rs::the_previous_identifier_is_the_fold_under_the_previous_upstream_identifiers",
]
